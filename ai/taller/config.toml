# Taller: every project the user works on, with its agents. Read by
# taller.py and board.py (or $TALLER_CONFIG).

[taller]
# Every git repository directly under these folders is a project, whether or
# not an agent runs in it. Projects with a live agent elsewhere are added too.
roots = ["~/src"]
# Projects outside the roots.
extra = ["/mnt/d/Documents/Godot/water", "~/.dotfiles"]
# Folder names (or full paths) never shown.
hide = ["interviews", "foundation"]
# Idle for longer than this (days since the last commit or conversation) is
# "dormant": collapsed into one line.
dormant_days = 14
# Extra claude arguments for the agents the board starts (⏎, n, w) and the
# orchestrator, e.g. ["--model", "haiku"]. Not passed to pi.
agent_args = []
# The herdr agent name of the chat beside the board (herdr/open.sh); it
# runs in the first of `roots`.
orchestrator_agent = "taller"

[ui]
# Seconds between refreshes of agent state; files are re-read on change.
agents_secs = 3
# Seconds between git scans of Taller projects.
git_secs = 20

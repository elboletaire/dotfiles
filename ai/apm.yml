name: dotfiles-skills
version: 1.0.0
description: Elboletaire's dotfiles skill set, managed by APM.
targets:
  - agent-skills
  - claude
dependencies:
  apm:
    - git: https://github.com/obra/superpowers.git
      path: skills/brainstorming
      alias: brainstorming
      ref: main
    - git: https://github.com/obra/superpowers.git
      path: skills/writing-plans
      alias: writing-plans
      ref: main
    - git: https://github.com/herdrdev/herdr.git
      path: skills/herdr
      alias: herdr
      ref: master
    - git: https://github.com/vocdoni/skills.git
      path: plugins/vocdoni-comments/skills/comments
      alias: comments
      ref: main
    - git: https://github.com/vocdoni/skills.git
      path: plugins/vocdoni-contributing/skills/contributing
      alias: contributing
      ref: main
    - git: https://github.com/vercel-labs/agent-browser.git
      path: skills/agent-browser
      alias: agent-browser
      ref: main
    - git: https://github.com/github/awesome-copilot.git
      path: skills/github-issues
      alias: github-issues
      ref: main
    - git: https://github.com/github/awesome-copilot.git
      path: skills/git-commit
      alias: git-commit
      ref: main
    - git: https://github.com/obra/superpowers.git
      path: skills/systematic-debugging
      alias: systematic-debugging
      ref: main
    - git: https://github.com/obra/superpowers.git
      path: skills/test-driven-development
      alias: test-driven-development
      ref: main
    - git: https://github.com/github/awesome-copilot.git
      path: skills/create-readme
      alias: create-readme
      ref: main
    - git: https://github.com/elboletaire/skills.git
      alias: elboletaire-skills
      ref: main

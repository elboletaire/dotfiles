# Octopilot inside herdr: an "Octopilot" workspace with the orchestrator on
# the left and the live dashboard on the right, plus the popups the dashboard
# opens. Link it with `herdr plugin link ~/.dotfiles/ai/octopilot/herdr`.
id = "elboletaire.octopilot"
name = "Octopilot"
version = "0.1.0"
min_herdr_version = "0.9.3"
platforms = ["linux", "macos"]
description = "Live Octopilot dashboard next to its orchestrator"

# Build (or focus) the Octopilot workspace.
[[actions]]
id = "open"
title = "Open Octopilot"
contexts = ["workspace"]
command = ["bash", "open.sh"]

# The dashboard over whatever you are doing; q closes it.
[[actions]]
id = "peek"
title = "Peek at the Octopilot dashboard"
contexts = ["workspace"]
command = ["bash", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin elboletaire.octopilot --entrypoint dashboard --placement overlay"]

[[panes]]
id = "dashboard"
title = "dashboard"
placement = "split"
command = ["bash", "../dashboard.sh"]

# Opened by the dashboard: a work agent (b), and a shell in its worktree (t).
# The agent popup is a direct attach to the agent's terminal; ctrl+b q
# detaches it, which closes the popup and leaves the agent running.
[[panes]]
id = "agent"
title = "Agent"
placement = "popup"
width = "92%"
height = "88%"
command = ["bash", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" agent attach \"$AP_AGENT\""]

[[panes]]
id = "shell"
title = "Worktree shell"
placement = "popup"
width = "92%"
height = "88%"
command = ["bash", "-c", "exec \"${SHELL:-bash}\" -l"]
